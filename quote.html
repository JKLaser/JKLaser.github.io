<style>
  html,body{margin:0;padding:0;height:100%;background:#0e1c2c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .ul-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
  .ul-card{background:#fff;border-radius:16px;padding:36px 30px;width:min(400px,100%);box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center}
  .ul-logo{width:74px;height:74px;border-radius:18px;background:linear-gradient(135deg,#f0a832,#e07b1a);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#fff}
  .ul-title{font-size:19px;font-weight:800;color:#12314b;margin-bottom:22px;letter-spacing:1px}
  .ul-input{width:100%;height:46px;border:1.5px solid #d7e0e8;border-radius:10px;padding:0 14px;font-size:15px;color:#12314b;box-sizing:border-box;outline:none;background:#fbfcfe;margin-bottom:12px}
  .ul-input:focus{border-color:#f0a832}
  .ul-btn{width:100%;height:46px;border:none;border-radius:10px;background:linear-gradient(135deg,#f0a832,#e07b1a);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px;transition:opacity .15s}
  .ul-btn:hover{opacity:.9}
  .ul-btn:disabled{opacity:.5;cursor:not-allowed}
  .ul-file{margin-top:14px;font-size:13px;color:#7a8896}
  .ul-file label{color:#e07b1a;cursor:pointer;text-decoration:underline}
  .ul-file input{display:none}
  .ul-divider{margin:18px 0;display:flex;align-items:center;color:#ccc;font-size:12px}
  .ul-divider::before,.ul-divider::after{content:'';flex:1;height:1px;background:#e0e0e0}
  .ul-divider span{padding:0 12px}
  .ul-loading{display:none;margin-top:12px;font-size:13px;color:#666}
  .ul-loading.show{display:block}
  #ulToast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#c0392b;color:#fff;padding:10px 18px;border-radius:9px;font-size:14px;display:none;z-index:99999;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  /* 修复右侧配置区域透明背景问题 */
  #quoteCol .quote-card{background:#fff!important;border:1px solid #e2e8ee!important;border-radius:14px!important;padding:16px!important;margin-bottom:16px!important}
  #quoteCol .quote-card table td{background:#fff!important}
  #quoteCol .quote-card table th{background:#f8fafc!important}
  /* 通知弹窗相对于按钮定位，而不是固定在视口 */
  #topNotifWrap{position:relative!important}
  #topNotifPanel{position:absolute!important;top:calc(100% + 8px)!important;right:0!important;left:auto!important;bottom:auto!important}
  /* 隐藏报价详情顶部的关闭栏（黑色块） */
  .qc-bar{display:none!important}
  /* 用户信息弹窗 */
  #userInfoPopover{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#fff;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:10002;width:240px;overflow:hidden}
  #userInfoPopover .uip-head{padding:14px 16px;background:linear-gradient(135deg,#12314b,#1e4976);color:#fff}
  #userInfoPopover .uip-head .uip-name{font-size:15px;font-weight:700;margin-bottom:4px}
  #userInfoPopover .uip-head .uip-role{display:inline-block;background:rgba(232,163,61,.25);color:#e8a33d;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600}
  #userInfoPopover .uip-body{padding:10px 16px}
  #userInfoPopover .uip-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px;border-bottom:1px solid #f0f0f0}
  #userInfoPopover .uip-row:last-child{border-bottom:none}
  #userInfoPopover .uip-row .label{color:#999}
  #userInfoPopover .uip-row .value{color:#333;font-weight:500}
  #opInfoNameCompact{cursor:pointer;position:relative}
  #opInfoNameCompact:hover{text-decoration:underline}
</style>

  (function () {

      t = String(t).replace(/-/g, '+').replace(/_/g, '/');
      while (t.length % 4) t += '=';
      var bin = atob(t), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

                        var _decryptedHtml = bufToStr(pt);

                      extra.appendChild(_nameSpan);
                      // 给用户名添加点击弹窗
                      (function(nameEl) {
                        var popover = document.createElement('div');
                        document.querySelectorAll('#cnUserPopover').forEach(function(old){old.remove();}); popover.id = 'cnUserPopover';
                        var roleText = '用户';
                        var perms = [];
                        try {
                          var ui = JSON.parse(sessionStorage.getItem('jk_user_info') || '{}');
                          if (ui.role === 'admin') roleText = '管理员';

                        var permLabels = [];
                        if (perms.indexOf('quote') >= 0) permLabels.push('报价');
                        if (perms.indexOf('contract') >= 0) permLabels.push('合同');
                        if (perms.indexOf('warehouse') >= 0) permLabels.push('仓储');
                        if (perms.indexOf('admin') >= 0) permLabels.push('管理');
                        var loginTime = '--', loginIP = '--';
                        try {
                          var ui2 = JSON.parse(sessionStorage.getItem('jk_user_info') || '{}');
                          loginTime = ui2.currentLoginTime || ui2.lastLoginTime || '--';
                          var _ip1 = ui2.currentLoginIP || ui2.lastLoginIP || '';
                          loginIP = (_ip1 && _ip1.indexOf('?') < 0 && _ip1 !== 'undefined' && _ip1 !== 'null') ? _ip1 : '本地';
                        } catch(e) {}
                        var lastTime = '--', lastIP = '--';
                        try {
                          var ui3 = JSON.parse(sessionStorage.getItem('jk_user_info') || '{}');
                          lastTime = ui3.lastLoginTime || '--';
                          var _ip2 = ui3.lastLoginIP || '';
                          lastIP = (_ip2 && _ip2.indexOf('?') < 0 && _ip2 !== 'undefined' && _ip2 !== 'null') ? _ip2 : '--';
                        } catch(e) {}
                        var avatarChar = _userName ? _userName.charAt(0) : 'U';
                        popover.innerHTML =
                          '<div class="cn-pop-head"><div class="cn-pop-user-row"><div class="cn-pop-avatar">' + window.escapeHtml(avatarChar) + '</div><div><div class="cn-pop-name">' + window.escapeHtml(_userName) + '</div><span class="cn-pop-role">👤 ' + roleText + '</span></div></div></div>' +
                          '<div class="cn-pop-body">' +
                            '<div class="cn-pop-row"><span class="cn-pop-label"><span class="cn-pop-icon">🔐</span>权限</span><span class="cn-pop-value">' + (permLabels.length ? permLabels.join('、') : '--') + '</span></div>' +
                            '<div class="cn-pop-row"><span class="cn-pop-label"><span class="cn-pop-icon">📋</span>本次登录</span><span class="cn-pop-value">' + window.escapeHtml(loginTime) + '</span></div>' +
                            '<div class="cn-pop-row"><span class="cn-pop-label"><span class="cn-pop-icon">🌐</span>登录IP</span><span class="cn-pop-value">' + window.escapeHtml(loginIP) + '</span></div>' +
                            '<div class="cn-pop-row"><span class="cn-pop-label"><span class="cn-pop-icon">⏰</span>上次登录</span><span class="cn-pop-value">' + window.escapeHtml(lastTime) + '</span></div>' +
                            '<div class="cn-pop-row"><span class="cn-pop-label"><span class="cn-pop-icon">🌐</span>上次IP</span><span class="cn-pop-value">' + window.escapeHtml(lastIP) + '</span></div>' +
                            '<div class="cn-pop-actions">' +
                              '<button class="cn-pop-btn cn-pop-btn-primary" onclick="if(window.CommonNav&&window.CommonNav.changePassword){window.CommonNav.changePassword();}else{alert(\'修改密码功能暂不可用\');}">修改密码</button>' +
                              '<button class="cn-pop-btn cn-pop-btn-danger" onclick="if(confirm(\'确定要退出登录吗？\')){window.CommonNav.logout();}">退出</button>' +
                            '</div>' +
                          '</div>';
                        document.body.appendChild(popover);
                        nameEl.addEventListener('click', function(e) {
                          e.stopPropagation();
                          popover.style.display = popover.style.display === 'block' ? 'none' : 'block'; var r=nameEl.getBoundingClientRect(); popover.style.setProperty('position','fixed','important'); popover.style.setProperty('left','auto','important'); popover.style.setProperty('margin-left','0','important'); popover.style.right='auto'; popover.style.setProperty('left',Math.max(12,Math.min(innerWidth-popover.offsetWidth-12,r.right-popover.offsetWidth))+'px','important'); popover.style.top=(r.bottom+12)+'px';
                        });
                        document.addEventListener('click', function() { popover.style.display = 'none'; });
                      })(_nameSpan);
                      // 隐藏common-nav自带的用户区（避免重复）
                      var cnUser = document.querySelector('.cn-user');
                      if (cnUser) cnUser.style.display = 'none';
                      // 进入 .inner 容器（如果有）
                      var inner = oldHeader.querySelector('.inner') || oldHeader;
                      var kids = inner.children;
                      for (var i = kids.length - 1; i >= 0; i--) {
                        var child = kids[i];
                        // 跳过品牌logo区、联系方式、报价/合同切换（和主导航重复）
                        if (child.className && (child.className.indexOf('brand') >= 0 || child.className.indexOf('logo') >= 0)) continue;
                        if (child.id === 'contactRow' || child.className === 'contacts') continue;
                        if (child.className && child.className.indexOf('top-nav') >= 0) continue;
                        if (child.id === 'topNav') continue;
                        if (child.className && child.className.indexOf('role-badge') >= 0) continue;
                        if (child.id === 'roleBadge') continue;
                        if (child.id === 'opInfoNameCompact') continue; // 已手动创建，跳过避免重复
                        // 运营信息区：移动里面的子元素（跳过用户名，已手动创建），不移动整个容器
                        if (child.id === 'operatorInfoCompact') {
                          child.style.display = 'flex';
                          var subKids = child.children;
                          for (var j = subKids.length - 1; j >= 0; j--) {
                            var sub = subKids[j];
                            if (sub.id === 'opInfoNameCompact') continue; // 跳过用户名
                            // 跳过修改密码和退出按钮（已移到用户弹窗里）
                            if (sub.textContent && (sub.textContent.indexOf('修改密码') >= 0 || sub.textContent.indexOf('退出') >= 0)) continue;
                            if (sub.id && (sub.id.indexOf('changePwd') >= 0 || sub.id.indexOf('logout') >= 0 || sub.id.indexOf('Logout') >= 0)) continue;
                            extra.insertBefore(sub, extra.firstChild);
                          }
                          continue; // 不移动容器本身
                        }
                        // 直接移动DOM元素（保留样式和事件）
                        extra.insertBefore(child, extra.firstChild);
                      }
                      oldHeader.remove();
                      // 确保用户名在最前面
                      var _nameEl = document.getElementById('opInfoNameCompact');
                      if (_nameEl && extra.firstChild !== _nameEl) {
                        extra.insertBefore(_nameEl, extra.firstChild);
                      }
                      // 迁移完成，移除隐藏样式，恢复显示
                      if (navHideStyle && navHideStyle.parentNode) navHideStyle.parentNode.removeChild(navHideStyle);
                      if (extra) extra.style.visibility = 'visible';
                    } else {
                      // 两者未同时就绪，继续轮询（最多10秒）
                      if (migrateOldNav._attempts === undefined) migrateOldNav._attempts = 0;
                      migrateOldNav._attempts++;
                      if (migrateOldNav._attempts < 100) {
                        setTimeout(migrateOldNav, 100);
                      } else {
                        if (navHideStyle && navHideStyle.parentNode) navHideStyle.parentNode.removeChild(navHideStyle);
                        var _e = document.getElementById('cnExtra');
                        if (_e) _e.style.visibility = 'visible';
                      }
                    }
                  })();
                } else if (attempts > 50) {
                  clearInterval(timer);
                  console.error('common-nav.js 加载超时');
                }
              }, 100);
            })();
            return true;
          });
      }).catch(function(err) {
        var accessStatus = document.getElementById('quoteAccessStatus');
        if (accessStatus) {
          accessStatus.dataset.state = 'error';
          accessStatus.textContent = '暂时无法打开报价页面，请返回系统入口重试或联系管理员确认访问权限。';
        }
        return false;
      });
    }

    window.QuoteAccess.open(function(userInfo, isCurrentSession, serverKey) {
      return tryUnlock(serverKey, userInfo, isCurrentSession);
    });
  })();

  </script>

<script>
// 点击税率单元格自动生成合同（支持动态渲染表格，使用事件委托）
(function() {
  function extractPrice(text) {
    if (!text) return 0;
    var yuanMatch = text.match(/(\d+(?:\.\d+)?)\s*元/);
    if (yuanMatch) return parseFloat(yuanMatch[1]) || 0;
    var nums = text.match(/\d+(?:\.\d+)?/g);
    if (nums && nums.length > 0) {
      var maxNum = 0;
      nums.forEach(function(n) { var v = parseFloat(n); if (v > maxNum) maxNum = v; });
      return maxNum;
    }
    return 0;
  }
  function collectQuoteConfig(taxRate) {
    // 查找包含税率文字的表格
    var tables = document.querySelectorAll('table');
    var table = null;
    for (var ti = 0; ti < tables.length; ti++) {
      if (tables[ti].textContent.indexOf('1%') >= 0 || tables[ti].textContent.indexOf('13%') >= 0) {
        table = tables[ti]; break;
      }
    }
    if (!table && tables.length > 0) table = tables[tables.length - 1];
    if (!table) return null;
    var config = { taxRate: taxRate, items: [], total: 0 };
    var rows = table.querySelectorAll('tr');
    rows.forEach(function(row) {
      var cells = row.querySelectorAll('td,th');
      if (cells.length >= 2) {
        var name = (cells[0].textContent || '').trim();
        var spec = (cells[1].textContent || '').trim();
        var price = cells.length >= 3 ? (cells[2].textContent || '').trim() : '';
        if (name && name !== '配置' && name !== '合同' && name !== '专项报价' && name !== '项目') {
          config.items.push({ name: name, spec: spec, price: price });
        }
        if ((name === '合同' || spec.indexOf('1%') >= 0) && taxRate === '1%') {
          config.total = extractPrice(price) || extractPrice(spec);
        }
        if ((name === '专项报价' || spec.indexOf('13%') >= 0) && taxRate === '13%') {
          config.total = extractPrice(price) || extractPrice(spec);
        }
      }
    });
    // 产品名称从左侧选中的机型获取
    var selectedModel = document.querySelector('.machine-btn.active, .model-btn.active, [class*="active"][class*="model"]');
    if (selectedModel) {
      config.productName = (selectedModel.textContent || '').trim();
    } else {
      config.productName = '光纤激光打标机';
    }
    if(window.quotePricingBridge&&window.QuoteEngine){var result=QuoteEngine.calc(quotePricingBridge.getSelection());config.productName=result.machineName;config.items=result.rows.map(function(row){return {name:row.name,spec:row.spec,price:row.priceText};});config.total=taxRate==='13%'?result.specialTotal:result.total;}
    if (window.SpecialPricing) {
      var context = window.SpecialPricing.context();
      config.quantity = context.quantity;
      config.pickup = context.pickup;
      if (context.request) {
        config.specialPriceTerms = window.SpecialPricing.terms(context.request);
        config.special_price_request_id = context.request.id;
      }
    }
    return config;
  }

  async function handleTaxClick(e) {
    var el = e.target.closest('td, th, div, span, a, button');
    if (!el) return;
    var table = el.closest('table');
    if (!table) return;
    var text = (el.textContent || '').trim();
    if (text.length > 50) return;
    var taxRate = null;
    if (text.indexOf('1%') >= 0) taxRate = '1%';
    else if (text.indexOf('13%') >= 0) taxRate = '13%';
    if (!taxRate) return;
    e.preventDefault();
    e.stopPropagation();

    try { if (window.SpecialPricing) await window.SpecialPricing.verifyCurrent(); } catch(err) { alert(err.message); return; }
    var config = collectQuoteConfig(taxRate);
    if (!config) return;

    // 保存配置鍒?sessionStorage
    sessionStorage.setItem('jk_quote_config', JSON.stringify(config));

    // 传递当前语言（从 localStorage 读取，合同页会自动恢复）
    var lang = '';
    try { lang = localStorage.getItem('ct_lang') || ''; } catch(e) {}

    // 跳转合同页
    var url = 'contract.html?tax=' + encodeURIComponent(taxRate);
    if (lang) url += '&lang=' + encodeURIComponent(lang);
    window.location.href = url;
  }

  // 使用事件委托，支持动态渲染的表格
  document.addEventListener('click', handleTaxClick);

  // 给税率单元格添加指针样式（轮询确保动态内容也生效）
  function styleTaxCells() {
    var tables = document.querySelectorAll('table');
    tables.forEach(function(table) {
      table.querySelectorAll('td, th').forEach(function(cell) {
        var text = (cell.textContent || '').trim();
        if (text.length <= 30 && (text.indexOf('1%') >= 0 || text.indexOf('13%') >= 0)) {
          cell.style.cursor = 'pointer';
          if (!cell.title) cell.title = '点击生成' + (text.indexOf('13%') >= 0 ? '13%' : '1%') + '合同';
        }
      });
    });
  }
  var styleTimer = setInterval(styleTaxCells, 1000);
  // 5分钟后停止轮询，避免持续消耗
  setTimeout(function() { clearInterval(styleTimer); }, 300000);
})();
</script></body>
